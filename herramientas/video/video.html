<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Parla, a la cola · el vídeo</title>
<style>
@font-face { font-family: 'Archivo'; font-weight: 400 900; font-stretch: 62% 125%;
  src: url('../../assets/fuentes/archivo-latin.woff2') format('woff2'); }
@font-face { font-family: 'Archivo'; font-weight: 400 900; font-stretch: 62% 125%;
  src: url('../../assets/fuentes/archivo-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0; }

:root {
  --bg: #ffffff; --surface: #f7f7f7; --line: #dfdfdf; --line-alta: #bebebe; --pista: #f0f0f0;
  --ink: #161616; --ink-2: #525252; --ink-3: #717171;
  --loss: #c02719; --ref: #1a67c2; --aura-ref: rgba(26, 103, 194, .07);
  --hueco: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 15 15' fill='none' stroke='%23000' stroke-width='1.5'><path d='M.75 4.25V3.75a3 3 0 0 1 3-3H4.25M10.75 .75h0.5a3 3 0 0 1 3 3V4.25M14.25 10.75v0.5a3 3 0 0 1-3 3H10.75M4.25 14.25H3.75a3 3 0 0 1-3-3V10.75M5.5 .75H9.5M14.25 5.5V9.5M9.5 14.25H5.5M.75 9.5V5.5'/></svg>");
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* En vertical, para el móvil. Lo importante queda entre 300 y 1540 px de
   alto: arriba y abajo, Reels y TikTok ponen sus botones encima. */
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
body { font-family: 'Archivo', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
.scene { position: absolute; inset: 0; display: none; }

.cond { font-weight: 800; font-stretch: 62%; text-transform: uppercase; line-height: .86; letter-spacing: -.01em; }
.cond78 { font-weight: 800; font-stretch: 78%; text-transform: uppercase; line-height: .94; letter-spacing: -.02em; }
.eti { font-weight: 700; font-size: 30px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.m { display: block; overflow: hidden; padding: .22em 0 .04em; margin-top: -.22em; }
/* el padding de arriba deja sitio a las tildes de las mayúsculas con un interlineado tan cerrado */
.m > * { display: block; }
.rojo { color: var(--loss); } .azul { color: var(--ref); }
.abs { position: absolute; left: 80px; width: 920px; }
.fuente { position: absolute; left: 80px; width: 920px; top: 1540px; font-size: 26px; font-weight: 500; color: var(--ink-3); line-height: 1.35; }

/* la ballena: la de la web, en dos tonos */
.ballena { display: block; height: auto; aspect-ratio: 384 / 256; overflow: visible; }
.ballena .sombra { fill: var(--b-sombra, #161616); }
.ballena .luz { fill: var(--b-luz, #8c8c8c); }
.fondo-ballena { position: absolute; right: -40px; bottom: 0; width: 1000px; --b-sombra: #ececec; --b-luz: #f5f5f5; }

/* lo que hay y lo que falta, como en la web */
.u { position: relative; flex: none; border-radius: 20%; background: var(--ink); }
.h { position: relative; flex: none; background: var(--loss);
  -webkit-mask: var(--hueco) center / 100% 100% no-repeat; mask: var(--hueco) center / 100% 100% no-repeat; }
.tira { display: flex; flex-wrap: wrap; }

/* la marca y la barra */
#bug { position: absolute; left: 80px; top: 150px; display: flex; align-items: center; gap: 18px; z-index: 5; }
#bug .ballena { width: 72px; }
#bug span { font-weight: 800; font-stretch: 85%; font-size: 32px; letter-spacing: .14em; text-transform: uppercase; }
#barra { position: absolute; left: 0; top: 0; width: 1080px; height: 10px; background: var(--loss); z-index: 6; transform-origin: left; }

/* portada: completa desde el primer fotograma, que es la miniatura */
#portada .bloque { position: absolute; left: 80px; top: 420px; width: 1000px; white-space: nowrap; }
#portada .l1 { font-size: 180px; }
#portada .l2 { font-size: 106px; font-weight: 600; font-stretch: 78%; color: var(--ink-2); margin-top: 22px; }
#portada .l3 { font-size: 290px; color: var(--ref); margin-top: 16px; white-space: nowrap; }
#portada .sel { position: relative; display: inline-block; }
#portada .sel::after { content: ''; position: absolute; left: 0; right: 0; bottom: 4px; height: 14px; background: var(--ref); }
#portada .sub { position: absolute; left: 80px; top: 1060px; width: 860px; font-size: 50px; font-weight: 600; font-stretch: 90%; line-height: 1.22; color: var(--ink-2); }
#portada .sub b { color: var(--ink); font-weight: 800; }
#portada .fondo-ballena { width: 1080px; right: -60px; --b-sombra: #e6e6e6; --b-luz: #f1f1f1; }

/* los mapas */
.mapa { position: absolute; left: 80px; width: 920px; }
.mapa .pie { display: flex; align-items: baseline; gap: 18px; margin-bottom: 12px; }
.mapa .nom { font-size: 64px; }
.mapa .dato { font-size: 30px; font-weight: 500; color: var(--ink-3); }
.mapa canvas { display: block; width: 920px; height: 540px; background: var(--bg); }
.mapa.parla .nom { color: var(--ref); }

/* dos cifras, una tras otra, cuando la voz las dice */
.pareja { position: absolute; left: 80px; width: 920px; }
.pareja .p { padding: 22px 0 30px; border-top: 3px solid var(--ink); }
.pareja .p + .p { border-top: 2px solid var(--line); }
.pareja .q { font-size: 40px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.pareja .v { font-size: 200px; line-height: .9; margin-top: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pareja .v small { font-size: 110px; margin-left: 12px; }
.pareja .bar { height: 30px; margin-top: 22px; transform-origin: left; border-radius: 15px; }
.pareja .p.parla .q, .pareja .p.parla .v { color: var(--ref); }
.pareja .p.parla .bar { background: var(--ref); }
.pareja .p.otra .bar { background: var(--ink); }
.cabeza { position: absolute; left: 80px; top: 300px; width: 920px; }
.cabeza .t { font-size: 96px; }
.cabeza .d { font-size: 40px; font-weight: 500; font-stretch: 92%; color: var(--ink-2); line-height: 1.25; margin-top: 18px; }

/* el metro */
#tren .metro { position: absolute; left: 80px; top: 1350px; width: 920px; border-top: 2px solid var(--line); padding-top: 28px; }
#tren .metro .eti { margin-bottom: 18px; }
#tren .metro .f { display: grid; grid-template-columns: 220px 1fr; align-items: center; column-gap: 20px; margin-bottom: 16px; }
#tren .metro .q { font-size: 34px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
#tren .metro .tira { gap: 12px; }
#tren .metro .tira > * { width: 62px; height: 62px; }
#tren .metro .cero { font-size: 96px; color: var(--loss); line-height: .8; transform-origin: left center; }

/* la cuenta */
#total .cosas { position: absolute; left: 80px; top: 360px; width: 920px; }
#total .cosas div { font-size: 110px; line-height: 1.02; }
#total .si { position: absolute; left: 80px; top: 330px; width: 920px; font-size: 84px; }
#total .rej { position: absolute; left: 80px; top: 600px; width: 920px; gap: 14px; }
#total .rej > * { width: 76px; height: 76px; }
#total .n { position: absolute; left: 66px; top: 1250px; font-size: 300px; color: var(--loss); font-variant-numeric: tabular-nums; transform-origin: left center; }
#total .pie { position: absolute; left: 400px; top: 1300px; width: 580px; font-size: 58px; font-weight: 800; font-stretch: 84%; line-height: 1.06; letter-spacing: -.01em; }

/* cierre */
#cierre .marca { position: absolute; left: 80px; top: 420px; width: 420px; }
#cierre .t { position: absolute; left: 80px; top: 820px; }
#cierre .t .x1, #cierre .t .x2 { font-size: 240px; }
#cierre .t .x2 { color: var(--loss); }
#cierre .url { position: absolute; left: 80px; top: 1280px; font-size: 50px; font-weight: 800; font-stretch: 80%; letter-spacing: -.01em; }
#cierre .elige { position: absolute; left: 80px; top: 1360px; font-size: 48px; font-weight: 700; font-stretch: 88%; color: var(--ref); }
</style>
</head>
<body>
<div id="stage">
  <div id="bug"><span></span></div>
  <div id="barra"></div>
</div>

<!-- los datos de la web, los mismos que pinta la portada -->
<script src="../../datos/datos.js"></script>
<script src="../../datos/sanidad.js"></script>
<script src="../../datos/transporte.js"></script>
<script src="../../datos/infraestructura.js"></script>
<script src="../../assets/calculo.js"></script>
<script src="../../assets/hospitales.js"></script>
<script src="cifras.js"></script>
<!-- los mapas de carreteras de Parla y de la otra -->
<script>['parla', CIFRAS.OTRA].forEach((id) => document.write('<script src="../../datos/mapa/' + id + '.js"><\/script>'));</script>
<!-- cuándo dice la voz cada cosa: lo escribe voz.py -->
<script src="salida/tiempos.js"></script>
<script>
'use strict';
const { num, PASO } = CIFRAS;
const F = CIFRAS.calcular(window);
const { S, DUR } = TIEMPOS;
const O = F.otra;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const cl = (x) => Math.max(0, Math.min(1, x));
const E = {
  out: (t) => 1 - Math.pow(1 - t, 4),
  expo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inOut: (t) => (t < .5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2),
  back: (t) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
const prog = (t, a, d, e = E.out) => e(cl((t - a) / d));
const fmt = (v, dec) => (v < 0 ? '−' : '') + num(Math.abs(v), dec);
const mayus = (s) => s[0].toUpperCase() + s.slice(1);

/* Cuándo dice la voz una frase: su inicio, o su final con fin(), más un poco. */
const en = (id, mas = 0) => TIEMPOS.F[id] + mas;
const fin = (id, mas = 0) => TIEMPOS.E[id] + mas;
/* Cuándo dice la palabra marcada de una frase (la cifra, casi siempre). */
const marca = (id, mas = 0) => TIEMPOS.M[id] + mas;

const BALLENA = ['M32.5 309.6C33.2 307.1 39.5 293.5 42.3 288.2C58.5 258.6 69.9 242 94.6 212.1C108.9 194.8 114.5 188.7 125.9 178.4C127.1 177.3 128.9 175.6 129.9 174.7C130.8 173.8 133.1 171.8 134.9 170.2C136.6 168.7 138.6 166.9 139.1 166.4C143.6 161.9 162.4 146.9 173 139.2C185.6 130.1 203.4 118.9 217.4 111.2C224.4 107.4 239.7 99.9 245.9 97.3C246.7 97 248.6 96.1 250.1 95.5C267.4 87.6 292.8 78.9 314.2 73.5C320.3 72 321.5 71.5 324.8 69.5C327.9 67.6 329.4 66.9 332.7 66C334.2 65.6 337.4 64.5 339.9 63.7C354.7 58.4 358 57.5 365 57.2C368 57.1 371.6 56.8 373 56.6C380 55.7 381.6 55.8 385.9 57.8C389.3 59.4 392.5 60.1 399.4 60.6C410.4 61.5 414.8 63.2 414.4 66.5C414.2 68.6 412.7 69.7 408.4 70.9C407 71.2 404.1 72 402 72.6C390.4 75.9 390.5 75.9 383.6 75.9C377.4 75.9 377.4 75.9 370.6 73.8C361.3 70.9 351.7 68.5 348.9 68.3C344.8 68 343.9 68.8 338.1 77.1C336.8 79 336.8 79.4 338.2 81.6C338.8 82.6 338.9 82.8 338.9 86.1C338.9 90.7 339.5 91.8 343.5 94.1C346.6 95.8 347.5 97.2 348 100.8C348.5 104.7 350.3 107.3 354.3 109.6C364.1 115.4 366.3 119.2 362 123.3C359.9 125.4 357.8 126.2 347.2 129C333.5 132.7 330.8 131.4 319.6 115.5C317.3 112.2 315.1 107.9 313.6 103.9C311.9 99.3 311.7 98.1 311.6 92.9C311.4 87.6 311.4 87.6 310.1 87.9C307.9 88.3 288.3 102.6 278.2 111.1C269.1 118.9 255.8 131.7 249.2 139C226.1 164.8 211 186.4 196.2 215C187 232.5 178.2 256 174.9 271.3C172.4 283 171.5 290.2 171.3 301.8L171.2 310.5L101.7 310.5C32.3 310.5 32.3 310.5 32.5 309.6Z',
  'M32.5 309.6C33.2 307.1 39.5 293.5 42.3 288.2C58.5 258.6 69.9 241.9 94.6 212.1C108.9 194.8 114.5 188.7 125.9 178.4C127.1 177.3 128.9 175.6 129.9 174.7C130.8 173.8 133.1 171.8 134.9 170.2C136.6 168.7 138.6 166.9 139.1 166.4C143.6 161.9 162.4 146.9 173 139.2C185.6 130.1 203.4 118.9 217.4 111.2C224.4 107.4 239.7 99.9 245.9 97.3C246.7 97 248.6 96.1 250.1 95.5C267.8 87.4 292 79.1 315.6 73.1C322 71.5 322.8 71.4 322.8 72.3C322.8 73.4 318.4 75.6 302.6 82.5C289.9 88 287.4 89.2 274.8 96.2C258.8 105 239.9 117.5 227 127.7C220.9 132.5 208.4 143.1 207 144.7C206.7 145.1 204.8 146.8 202.9 148.5C198.3 152.6 184.5 166.4 180.3 171.1C178.4 173.2 176.5 175.3 175.9 175.9C171.6 180.2 156.9 198.7 148.8 209.9C140.6 221.4 125 245.2 114.4 262.5C106.4 275.5 101.8 282.8 98.2 288.3C96.5 291 94.3 294.4 93.5 295.9C91.8 299.1 90.9 300.5 88.5 303.9C87.3 305.7 86.6 307 86.2 308.4C85.5 310.4 85.5 310.4 58.9 310.4C32.3 310.5 32.3 310.5 32.5 309.6ZM377.6 75.8C377 75.6 373.7 74.7 370.3 73.7C362.8 71.4 353.3 68.9 349.3 68.2C347.7 67.9 345.5 67.5 344.5 67.3C343.5 67 341.9 66.7 341.1 66.6C338 66.3 337.3 65.9 337.8 65C338.1 64.3 339.4 63.7 343.5 62.4C345.5 61.7 348.8 60.7 350.8 60C357 57.9 358.9 57.5 365 57.2C368 57.1 371.6 56.8 373 56.6C380 55.7 381.6 55.8 385.9 57.8C389.3 59.4 392.5 60.1 399.4 60.6C410.4 61.5 414.8 63.2 414.4 66.5C414.2 68.6 412.7 69.7 408.4 70.9C407 71.2 404.1 72 402 72.6C390.7 75.8 390.7 75.8 384.4 75.9C381.2 75.9 378.2 75.9 377.6 75.8Z'];
const ballena = (cls = '') => `<svg class="ballena ${cls}" viewBox="31 55 384 256"><path class="sombra" d="${BALLENA[0]}"/><path class="luz" d="${BALLENA[1]}"/></svg>`;
const hueco = '<div class="h"></div>';
/* Cada efecto lleva el segundo del vídeo en que empieza. */
const fx = (tipo, a, d = .5) => `data-fx="${tipo}" data-a="${a}" data-d="${d}"`;
const cuenta = (v, dec, a, d = 1.0) => `<span data-count="${v}" data-dec="${dec || 0}" data-a="${a}" data-d="${d}">0</span>`;
const sube = (html, a, d = .55, cls = '') => `<span class="m"><span class="${cls}" ${fx('up', a, d)}>${html}</span></span>`;
const ids = Object.keys(S);
const escena = (id, html) => {
  const i = ids.indexOf(id);
  return `<section class="scene" id="${id}" data-from="${S[id]}" data-to="${i < ids.length - 1 ? S[ids[i + 1]] : DUR + 1}">${html}</section>`;
};
/* Parla y la otra, cada una cuando la voz la nombra */
const pareja = (top, pv, ov, dec, unidad, aP, aO) => {
  const max = Math.max(pv, ov);
  const p = (k, n, v, a) => `<div class="p ${k}" ${fx('left', a, .45)}><div class="q">${n}</div>
      <div class="v cond">${cuenta(v, dec, a + .1)}<small>${unidad}</small></div>
      <div class="bar" style="width:${v / max * 100}%" ${fx('grow', a + .1, 1.1)}></div></div>`;
  return `<div class="pareja" style="top:${top}px">${p('parla', 'Parla', pv, aP)}${p('otra', O, ov, aO)}</div>`;
};

$('#bug').insertAdjacentHTML('afterbegin', ballena());
$('#bug span').textContent = F.web;
const sp = F.sale.parla, so = F.sale.otra;
const hParla = mayus(F.camas.hParla), hOtra = mayus(F.camas.hospital);
const html = [
  /* ═══ PORTADA: la pregunta, completa en el primer fotograma ═══ */
  escena('portada', `
    ${ballena('fondo-ballena')}
    <div class="bloque">
      <span class="cond l1" style="display:block">¿Y si en Parla</span>
      <span class="cond l2" style="display:block">viviéramos como en</span>
      <span class="cond l3" style="display:block"><span class="sel">${O}</span><span style="color:var(--ink)">?</span></span>
    </div>
    <div class="sub">Lo que le falta a Parla, <b>contado por una vecina</b>. Con datos oficiales.</div>`),

  /* ═══ POR LA MAÑANA, EN COCHE: los dos mapas ═══ */
  escena('coche', `
    <div class="eti abs" style="top:290px" ${fx('fade', en('manana'), .5)}>Por dónde salen por carretera, de 6 a 10</div>
    <div class="mapa parla" style="top:350px" ${fx('fade', en('manana', .2), .7)}>
      <div class="pie"><span class="nom cond">Parla</span><span class="dato">${num(Math.round(sp.personas))} personas</span></div>
      <canvas id="mapa-parla" width="1840" height="1080"></canvas></div>
    <div class="mapa otra" style="top:990px" ${fx('fade', en('repartida', -.3), .7)}>
      <div class="pie"><span class="nom cond">${O}</span><span class="dato">${num(Math.round(so.personas))} personas</span></div>
      <canvas id="mapa-otra" width="1840" height="1080"></canvas></div>`),

  /* ═══ EN TREN ═══ */
  escena('tren', `
    <div class="cabeza"><div class="t cond78">${sube('Hasta Atocha', en('atocha', -.3))}${sube('en tren', en('atocha', -.15))}</div>
      <div class="d" ${fx('fade', en('atocha', .6), .5)}>Minutos desde la casa del medio: la mitad de las casas tarda más</div></div>
    ${pareja(660, F.atocha.parla, F.atocha.otra, 0, ' min', marca('atocha', -.1), en('atocha-otra', .5))}
    <div class="metro" ${fx('fade', en('metro', -.1), .5)}><div class="eti">Estaciones de Metro</div>
      <div class="f"><span class="q azul">Parla</span><span class="cero cond" ${fx('slam', en('metro', .9), .45)}>0</span></div>
      <div class="f"><span class="q">${O}</span><div class="tira" id="metro-otra">${'<div class="u"></div>'.repeat(F.metro.otra)}</div></div>
    </div>`),

  /* ═══ EL HOSPITAL ═══ */
  escena('hospital', `
    <div class="cabeza"><div class="t cond78">${sube(hParla, en('malo', 1.0))}</div>
      <div class="d" ${fx('fade', en('cama'), .5)}>Camas por cada 1.000 personas que atiende el hospital público</div></div>
    ${pareja(560, F.camas.parla, F.camas.otra, 1, '', en('cama', 1.0), en('cama-otra', .3))}
    <div class="fuente" ${fx('fade', en('cama-otra', .8), .5)}>${hParla}, ${num(F.camas.nParla)} camas. ${hOtra}, ${num(F.camas.nOtra)}. Catálogo Nacional de Hospitales y memorias del SERMAS.</div>`),

  /* ═══ EL DINERO ═══ */
  escena('dinero', `
    <div class="cabeza"><div class="t cond78">${sube('Lo que invierte', en('invierte', .3))}${sube('el ayuntamiento', en('invierte', .45))}</div>
      <div class="d" ${fx('fade', en('invierte', 1.0), .5)}>Euros por vecino y año en obra nueva, reformas y equipamiento. Media de 2021 a 2024</div></div>
    ${pareja(640, F.inversion.parla, F.inversion.otra, 0, ' €', marca('invierte', -.1), en('invierte-otra', .5))}`),

  /* ═══ LA CUENTA: el 21, al final ═══ */
  escena('total', `
    <div class="cosas">${['Colegios', 'Centros de salud', 'Bibliotecas', 'Estaciones…'].map((c, i, a) => {
      const d = fin('todo') - en('todo');
      return `<div class="cond78" ${fx('left', en('todo', d * (0.32 + 0.6 * i / a.length)), .4)}>${c}</div>`;
    }).join('')}</div>
    <div class="si cond78">${sube('Si Parla estuviera', en('si', -.1))}${sube('como <span class="azul">' + O + '</span>,', en('si', .2))}${sube('tendríamos', en('si', .9))}</div>
    <div class="rej tira" id="rej">${'<div class="u"></div>'.repeat(F.tiene)}${hueco.repeat(F.total)}</div>
    <div class="n cond" ${fx('pop', marca('si', -F.total * PASO - .1), .4)}><span id="n-total">0</span></div>
    <div class="pie" ${fx('left', marca('si', .3), .5)}>equipamientos y servicios públicos <span class="rojo">más</span></div>`),

  /* ═══ CIERRE ═══ */
  escena('cierre', `
    <div class="marca" ${fx('pop', S.cierre + .4, .5)}>${ballena()}</div>
    <div class="t">${sube('Parla,', S.cierre + .6, .5, 'x1 cond')}${sube('a la cola', S.cierre + .8, .5, 'x2 cond')}</div>
    <div class="url" ${fx('left', en('haz', -.2), .45)}>siyovivieracomoenparla.netlify.app</div>
    <div class="elige" ${fx('left', en('haz', .1), .45)}>Haz la cuenta con tu ciudad.</div>`)
].join('');
$('#barra').insertAdjacentHTML('beforebegin', html);

/* ── Los mapas de carreteras, como en infraestructura.html
   (assets/infraestructura-mapa.js): el ancho de cada carretera es la gente
   que sale por ella, con la misma regla en los dos, y cada mapa con su
   escala para que su término llene el marco. Los puntos avanzan con el
   tiempo del vídeo, así que cada fotograma sale igual cada vez. ── */
const MAPAS = (() => {
  const MARGEN = 3200, VELOCIDAD = 700, ANCHO_MAX = 34, ANCHO_MIN = 2, AIRE = 22;
  const ANCHO = 920, ALTO = 540, R = 2;
  function caja(m) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    m.limite.forEach((an) => an.forEach((p) => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }));
    return { x0, y0, x1, y1 };
  }
  function preparar(m) {
    m.vias.forEach((v) => {
      const c = v.c, acc = [0];
      for (let i = 1; i < c.length; i++) acc.push(acc[i - 1] + Math.hypot(c[i][0] - c[i - 1][0], c[i][1] - c[i - 1][1]));
      const nt = [];
      for (let i = 1; i < c.length; i++) { const l = acc[i] - acc[i - 1] || 1; nt.push([-(c[i][1] - c[i - 1][1]) / l, (c[i][0] - c[i - 1][0]) / l]); }
      v._c = c; v._acc = acc; v._len = acc[acc.length - 1];
      v._n = c.map((_, i) => {
        const a = nt[Math.max(0, i - 1)], b = nt[Math.min(nt.length - 1, i)], x = a[0] + b[0], y = a[1] + b[1], l = Math.hypot(x, y) || 1;
        return [x / l, y / l];
      });
    });
    return m;
  }
  /* mulberry32: un azar pequeño y repetible a partir de una semilla */
  function aleatorio(s) {
    let a = s >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function enPunto(v, d) {
    const acc = v._acc, c = v._c, n = v._n;
    let i = 1;
    while (i < acc.length - 1 && acc[i] < d) i++;
    const t = cl((d - acc[i - 1]) / (acc[i] - acc[i - 1] || 1));
    const nx = n[i - 1][0] + (n[i][0] - n[i - 1][0]) * t, ny = n[i - 1][1] + (n[i][1] - n[i - 1][1]) * t, l = Math.hypot(nx, ny) || 1;
    return [c[i - 1][0] + (c[i][0] - c[i - 1][0]) * t, c[i - 1][1] + (c[i][1] - c[i - 1][1]) * t, nx / l, ny / l];
  }
  const mm = [window.MAPA[DATOS.REFERENCIA], window.MAPA[F.OTRA]].map(preparar);
  /* el ancho por persona, el mismo en los dos: la carretera más cargada, a ANCHO_MAX */
  let tope = 0; mm.forEach((m) => m.vias.forEach((v) => { tope = Math.max(tope, v.s || 0); }));
  const ppp = ANCHO_MAX / tope;
  return mm.map((m, k) => {
    const ref = k === 0;
    const bx = caja(m), w = bx.x1 - bx.x0 + 2 * MARGEN, h = bx.y1 - bx.y0 + 2 * MARGEN;
    const mpp = Math.max(w / ANCHO, h / ALTO), cx = (bx.x0 + bx.x1) / 2, cy = (bx.y0 + bx.y1) / 2;
    const px = (p) => [ANCHO / 2 + (p[0] - cx) / mpp, ALTO / 2 - (p[1] - cy) / mpp];
    const col = { gente: ref ? '#1a67c2' : '#717171', suelo: ref ? 'rgba(26,103,194,.07)' : '#f7f7f7', marca: ref ? '#1a67c2' : '#161616' };
    const azar = aleatorio(m.id.length * 7919 + 17), puntos = [];
    m.vias.forEach((v) => {
      if (!v.s || !v._len) return;
      v._w = Math.max(ANCHO_MIN, v.s * ppp);
      const n = Math.round(v.s * ppp * (v._len / mpp) / AIRE);
      for (let i = 0; i < n; i++) puntos.push({ v, d: (i + azar()) * v._len / n, u: azar() - 0.5, vel: 0.75 + azar() * 0.5 });
    });
    /* las bandas, opacas en una capa aparte para que los solapes no manchen */
    const capa = document.createElement('canvas'); capa.width = ANCHO * R; capa.height = ALTO * R;
    const b = capa.getContext('2d'); b.setTransform(R, 0, 0, R, 0, 0);
    b.strokeStyle = col.gente; b.lineCap = 'round'; b.lineJoin = 'round';
    m.vias.forEach((v) => {
      if (!v._w) return;
      b.lineWidth = v._w; b.beginPath();
      v._c.forEach((p, i) => { const q = px(p); i ? b.lineTo(q[0], q[1]) : b.moveTo(q[0], q[1]); });
      b.stroke();
    });
    const lienzo = $(ref ? '#mapa-parla' : '#mapa-otra');
    const traza = (ctx, l) => l.forEach((p, i) => { const q = px(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    /* etiqueta(i) dice cuánto se ve la parte de cada salida, de 0 a 1 */
    return function dibujar(t, etiqueta) {
      const ctx = lienzo.getContext('2d');
      ctx.setTransform(R, 0, 0, R, 0, 0);
      ctx.clearRect(0, 0, ANCHO, ALTO);
      ctx.beginPath(); m.limite.forEach((an) => { traza(ctx, an); ctx.closePath(); });
      ctx.fillStyle = col.suelo; ctx.fill('evenodd'); ctx.lineWidth = 2.5; ctx.strokeStyle = '#161616'; ctx.stroke();
      ctx.lineWidth = 1.2; ctx.strokeStyle = '#dfdfdf';
      (m.fondo || []).forEach((l) => { ctx.beginPath(); traza(ctx, l.c); ctx.stroke(); });
      ctx.globalAlpha = ref ? 0.26 : 0.22; ctx.drawImage(capa, 0, 0, ANCHO, ALTO); ctx.globalAlpha = 1;
      ctx.fillStyle = col.gente;
      puntos.forEach((p) => {
        const e = enPunto(p.v, (p.d + VELOCIDAD * p.vel * t) % p.v._len), q = px(e), a = p.u * (p.v._w - 2);
        ctx.beginPath(); ctx.arc(q[0] + e[2] * a, q[1] - e[3] * a, 2, 0, Math.PI * 2); ctx.fill();
      });
      /* un kilómetro, abajo a la izquierda */
      const km = 1000 / mpp;
      ctx.fillStyle = '#161616'; ctx.fillRect(14, ALTO - 16, km, 3);
      ctx.font = '600 18px Archivo'; ctx.textBaseline = 'alphabetic'; ctx.fillText('1 km', 14, ALTO - 26);
      /* las salidas con al menos el 5 %, con su parte; la más grande de Parla, enorme */
      ctx.textBaseline = 'middle';
      (m.puertas || []).forEach((g, i) => {
        const p = etiqueta(i);
        if (!(g.pct >= 5) || p <= 0) return;
        const grande = ref && i === 0, fs = grande ? 64 : 28;
        ctx.font = `800 ${fs}px Archivo`;
        const q = px([g.x, g.y]), txt = num(g.pct, 0) + ' %', w = ctx.measureText(txt).width + fs * 0.7, hh = fs * 1.35;
        /* la grande, a la izquierda y algo más abajo, para que no tape la carretera */
        const dx = grande ? -w - 50 : 10, dy = grande ? 60 : -hh / 2;
        const x = Math.min(ANCHO - w - 4, Math.max(4, q[0] + dx)), y = Math.min(ALTO - hh / 2 - 4, Math.max(hh / 2 + 4, q[1] + dy));
        ctx.save(); ctx.globalAlpha = cl(p * 2);
        ctx.translate(x, y); const s = 0.6 + 0.4 * E.back(p); ctx.scale(s, s);
        ctx.fillStyle = grande ? col.marca : '#fff'; ctx.fillRect(0, -hh / 2, w, hh);
        ctx.strokeStyle = col.marca; ctx.lineWidth = 3; ctx.strokeRect(0, -hh / 2, w, hh);
        ctx.fillStyle = grande ? '#fff' : col.marca; ctx.fillText(txt, fs * 0.35, 2);
        ctx.restore();
      });
    };
  });
})();

const FX = $$('[data-fx]');
const COUNTS = $$('[data-count]');
const SCENES = $$('.scene');

function aplicar(el, t) {
  const a = +el.dataset.a, d = +el.dataset.d, f = el.dataset.fx;
  let p;
  switch (f) {
    case 'up': p = prog(t, a, d, E.expo); el.style.transform = `translateY(${(1 - p) * 135}%)`; break;
    case 'fade': p = prog(t, a, d); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 24}px)`; break;
    case 'left': p = prog(t, a, d, E.expo); el.style.opacity = cl(p * 1.6); el.style.transform = `translateX(${(1 - p) * -90}px)`; break;
    case 'grow': p = prog(t, a, d, E.expo); el.style.transform = `scaleX(${p})`; break;
    case 'pop': p = cl((t - a) / d); el.style.opacity = cl(p * 3); el.style.transform = `scale(${0.6 + 0.4 * E.back(p)})`; el.style.transformOrigin = 'left center'; break;
    case 'slam': p = cl((t - a) / d); el.style.opacity = cl(p * 4); el.style.transform = `scale(${1 + 0.4 * (1 - E.out(p))})`; break;
  }
}

/* Entre escenas, un fundido corto: la que sale se apaga y la que entra sube. */
const FUNDE = 0.45;
function mostrar(el, t) {
  const a = +el.dataset.from, b = +el.dataset.to;
  const on = t >= a && t < b + FUNDE;
  el.style.display = on ? 'block' : 'none';
  if (!on) return;
  const entra = a === 0 ? 1 : prog(t, a, FUNDE, E.inOut), sale = 1 - prog(t, b, FUNDE, E.inOut);
  el.style.opacity = Math.min(entra, sale);
  el.style.transform = entra < 1 ? `translateY(${(1 - entra) * 40}px)` : '';
}

function aparece(u, t, a, dur = 0.3) {
  const p = cl((t - a) / dur);
  u.style.opacity = cl(p * 3);
  u.style.transform = `scale(${Math.max(0, 0.4 + 0.6 * E.back(p))})`;
}

function render(t) {
  SCENES.forEach((s) => mostrar(s, t));
  FX.forEach((el) => aplicar(el, t));
  COUNTS.forEach((el) => {
    const v = +el.dataset.count, dec = +(el.dataset.dec || 0);
    let x = v * prog(t, +el.dataset.a, +el.dataset.d, E.out);
    if (dec === 0) x = Math.round(x);
    el.textContent = fmt(x, dec);
  });

  /* los mapas: la gente fluye todo el rato; la parte de cada salida, cuando la voz llega */
  if (t >= S.coche && t < S.tren + FUNDE) {
    const a42 = fin('a42', -1.2);
    MAPAS[0](t, (i) => prog(t, i === 0 ? a42 : en('repartida', 2.6), .5));
    MAPAS[1](t, (i) => prog(t, en('repartida', .5 + i * 0.3), .5));
  }

  /* el metro de la otra: estación a estación */
  $$('#metro-otra > *').forEach((u, i) => aparece(u, t, en('metro', .2 + i * 0.07)));

  /* la cuenta: las cosas se van, entra lo que hay, y luego los huecos uno a uno */
  $('#total .cosas').style.opacity = 1 - prog(t, en('ajustado', -.3), .35);
  $('#total .si').style.opacity = t >= en('si', -.2) ? 1 : 0;
  /* el último hueco cae cuando la voz dice la cifra */
  const T0 = marca('si', -F.total * PASO);
  let hechos = 0;
  $$('#rej > *').forEach((u, i) => {
    if (i < F.tiene) { aparece(u, t, en('ajustado', .2) + i * 0.03, 0.25); return; }
    const k = i - F.tiene, a = T0 + k * PASO;
    if (t >= a) hechos = k + 1;
    aparece(u, t, a, 0.22);
  });
  $('#n-total').textContent = hechos;
  const g = cl((t - (T0 + F.total * PASO)) / 0.4);
  $('#total .n').style.transform = g > 0 && g < 1 ? `scale(${1 + 0.06 * Math.sin(g * Math.PI)})` : '';

  /* marca y barra de avance */
  $('#bug').style.opacity = t < S.cierre ? 1 : 0;
  $('#barra').style.transform = `scaleX(${t / DUR})`;
  $('#barra').style.opacity = t >= S.coche ? 1 : 0;
}

window.render = render; window.DUR = DUR;
document.title = 'Parla y ' + O + ' · ' + num(DUR, 1) + ' s';
document.fonts.ready.then(() => { window.listo = true; render(+location.hash.slice(1) || 0); });
</script>
</body>
