<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Parla, a la cola · el vídeo</title>
<style>
@font-face { font-family: 'Archivo'; font-weight: 400 900; font-stretch: 62% 125%;
  src: url('../../assets/fuentes/archivo-latin.woff2') format('woff2'); }
@font-face { font-family: 'Archivo'; font-weight: 400 900; font-stretch: 62% 125%;
  src: url('../../assets/fuentes/archivo-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0; }

:root {
  --bg: #ffffff; --line: #dfdfdf; --pista: #f0f0f0; --gris-barra: #bebebe;
  --ink: #161616; --ink-2: #525252; --ink-3: #717171;
  --loss: #c02719; --ref: #1a67c2; --gain: #1d7635;
  --hueco: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 15 15' fill='none' stroke='%23000' stroke-width='1.5'><path d='M.75 4.25V3.75a3 3 0 0 1 3-3H4.25M10.75 .75h0.5a3 3 0 0 1 3 3V4.25M14.25 10.75v0.5a3 3 0 0 1-3 3H10.75M4.25 14.25H3.75a3 3 0 0 1-3-3V10.75M5.5 .75H9.5M14.25 5.5V9.5M9.5 14.25H5.5M.75 9.5V5.5'/></svg>");
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* En vertical, para el móvil. Lo importante queda entre 330 y 1500 px de
   alto: arriba y abajo, Reels y TikTok ponen sus botones encima. */
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
body { font-family: 'Archivo', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
.scene { position: absolute; inset: 0; display: none; will-change: transform; }

.cond { font-weight: 800; font-stretch: 62%; text-transform: uppercase; line-height: .86; letter-spacing: -.01em; }
.cond78 { font-weight: 800; font-stretch: 78%; text-transform: uppercase; line-height: .94; letter-spacing: -.02em; }
.eti { font-weight: 700; font-size: 30px; letter-spacing: .14em; text-transform: uppercase; }
.m { display: block; overflow: hidden; padding: .22em 0 .04em; margin-top: -.22em; }
/* el padding de arriba deja sitio a las tildes de las mayúsculas con un interlineado tan cerrado */
.m > * { display: block; }
.rojo { color: var(--loss); } .azul { color: var(--ref); } .verde { color: var(--gain); } .gris { color: var(--ink-2); }
.caja { position: absolute; left: 80px; width: 920px; }
.tit { font-size: 92px; }
.lead { font-size: 40px; font-weight: 500; font-stretch: 92%; line-height: 1.3; color: var(--ink-2); }
.lead b { color: var(--ink); font-weight: 800; }
.fuente { position: absolute; left: 80px; width: 920px; top: 1530px; font-size: 26px; font-weight: 500; color: var(--ink-3); line-height: 1.35; }

/* la ballena: la de la web, en dos tonos */
.ballena { display: block; height: auto; aspect-ratio: 384 / 256; overflow: visible; }
.ballena .sombra { fill: var(--b-sombra, #161616); }
.ballena .luz { fill: var(--b-luz, #8c8c8c); }
.fondo-ballena { position: absolute; right: -40px; bottom: 0; width: 1000px; --b-sombra: #ececec; --b-luz: #f5f5f5; }

/* lo que hay y lo que falta, como en la web */
.u { position: relative; flex: none; border-radius: 20%; background: var(--ink); }
.h { position: relative; flex: none; background: var(--loss);
  -webkit-mask: var(--hueco) center / 100% 100% no-repeat; mask: var(--hueco) center / 100% 100% no-repeat; }
.tira { display: flex; flex-wrap: wrap; }

/* la marca, el capítulo y la barra */
#bug { position: absolute; left: 80px; top: 140px; display: flex; align-items: center; gap: 18px; z-index: 5; }
#bug .ballena { width: 72px; }
#bug span { font-weight: 800; font-stretch: 85%; font-size: 32px; letter-spacing: .14em; text-transform: uppercase; }
#cap { position: absolute; left: 80px; top: 222px; z-index: 5; color: var(--ink-3); display: flex; gap: 18px; align-items: baseline; }
#cap b { color: var(--loss); font-weight: 800; }
#barra { position: absolute; left: 0; top: 0; width: 1080px; height: 10px; background: var(--loss); z-index: 6; transform-origin: left; }
#wipe { position: absolute; inset: 0; background: var(--loss); z-index: 20; display: none; }
#wipe .ballena { position: absolute; left: 50%; top: 50%; width: 420px; margin: -200px 0 0 -210px; --b-sombra: #ffffff; --b-luz: #f3c9c4; }
#wipe .rot { position: absolute; left: 0; right: 0; top: 50%; margin-top: 120px; text-align: center; color: #fff;
  font-weight: 800; font-stretch: 80%; font-size: 58px; letter-spacing: .14em; text-transform: uppercase; }

/* portada: completa desde el primer fotograma, que es la miniatura */
#portada .bloque { position: absolute; left: 80px; top: 330px; width: 940px; }
#portada .l1 { font-size: 150px; }
#portada .l2 { font-size: 92px; font-weight: 600; font-stretch: 78%; color: var(--ink-2); margin-top: 18px; }
#portada .l3 { font-size: 230px; color: var(--ref); margin-top: 14px; white-space: nowrap; }
#portada .sel { position: relative; display: inline-block; }
#portada .sel::after { content: ''; position: absolute; left: 0; right: 0; bottom: 4px; height: 14px; background: var(--ref); }
#portada .flecha { display: inline-block; width: 80px; height: 80px; margin-left: 8px; vertical-align: 40px; }
#portada .ten { margin-top: 10px; display: flex; align-items: center; gap: 36px; }
#portada .ten .n { font-size: 470px; color: var(--loss); line-height: .8; }
#portada .ten .t { font-size: 66px; font-weight: 800; font-stretch: 84%; line-height: 1.06; letter-spacing: -.01em; }
#portada .ten .t span { color: var(--loss); }

/* la cuenta */
#cuenta .fila { position: absolute; left: 80px; width: 920px; }
#cuenta .nom { font-size: 40px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
#cuenta .dato { font-size: 44px; font-weight: 500; font-stretch: 92%; color: var(--ink-2); line-height: 1.25; margin-top: 8px; }
#cuenta .dato b { color: var(--ink); font-weight: 800; }
#cuenta .tira { gap: 22px; margin-top: 26px; }
#cuenta .tira > * { width: 124px; height: 124px; }
#cuenta .dif { position: absolute; left: 80px; top: 1250px; font-size: 230px; color: var(--loss); transform-origin: left center; }
#cuenta .dif small { display: block; font-size: 46px; font-weight: 700; font-stretch: 88%; letter-spacing: 0; text-transform: none; line-height: 1.15; color: var(--ink); margin-top: 18px; }

/* el total */
#total .n { position: absolute; left: 66px; top: 540px; font-size: 400px; color: var(--loss); font-variant-numeric: tabular-nums; transform-origin: left center; }
#total .rej { position: absolute; left: 80px; top: 930px; width: 920px; gap: 14px; }
#total .rej > * { width: 76px; height: 76px; }
#total .pie { position: absolute; left: 470px; top: 630px; width: 540px; font-size: 54px; font-weight: 800; font-stretch: 84%; line-height: 1.06; letter-spacing: -.01em; }
#total .pie span { display: block; font-size: 34px; font-weight: 500; font-stretch: 92%; color: var(--ink-3); margin-top: 16px; letter-spacing: 0; }

/* lo que no hay */
#cero .lista { position: absolute; left: 80px; top: 560px; width: 920px; }
#cero .cab { display: flex; justify-content: flex-end; gap: 0; color: var(--ink-3); font-size: 26px; padding-bottom: 12px; }
#cero .it { display: grid; grid-template-columns: 64px 1fr 190px; align-items: center; column-gap: 26px; border-top: 3px solid var(--ink); padding: 26px 0; }
#cero .it:not(:nth-child(2)) { border-top: 2px solid var(--line); }
#cero .it .h { width: 64px; height: 64px; }
#cero .it .t { font-size: 54px; font-weight: 800; font-stretch: 80%; letter-spacing: -.015em; line-height: 1.02; }
#cero .it .v { text-align: right; font-size: 84px; font-weight: 800; font-stretch: 66%; color: var(--loss); font-variant-numeric: tabular-nums; }

/* dos cifras enfrentadas, como en las páginas de cada área */
.pareja { position: absolute; left: 80px; width: 920px; }
.pareja .p { padding: 26px 0 30px; border-top: 3px solid var(--ink); }
.pareja .p + .p { border-top: 2px solid var(--line); }
.pareja .q { font-size: 38px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.pareja .v { font-size: 250px; line-height: .9; margin-top: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pareja .v small { font-size: 100px; margin-left: 10px; }
.pareja .bar { height: 26px; margin-top: 20px; transform-origin: left; border-radius: 13px; }
.pareja .p.parla .q, .pareja .p.parla .v { color: var(--ref); }
.pareja .p.parla .bar { background: var(--ref); }
.pareja .p.otra .bar { background: var(--ink); }
.pareja .nota { font-size: 34px; font-weight: 500; color: var(--ink-3); margin-top: 14px; line-height: 1.3; }
.eti-area { position: absolute; left: 80px; top: 330px; color: var(--ink-3); }
.pregunta { position: absolute; left: 80px; top: 385px; width: 920px; font-size: 54px; font-weight: 800; font-stretch: 82%; line-height: 1.08; letter-spacing: -.01em; }

/* las unidades del hospital */
#unidades .n { position: absolute; left: 70px; top: 360px; font-size: 330px; color: var(--loss); }
#unidades .txt { position: absolute; left: 400px; top: 420px; width: 600px; font-size: 50px; font-weight: 800; font-stretch: 84%; line-height: 1.08; }
#unidades .chips { position: absolute; left: 80px; top: 740px; width: 920px; display: flex; flex-wrap: wrap; gap: 16px; }
#unidades .chip { display: flex; align-items: center; gap: 14px; padding: 14px 22px 14px 16px; border: 3px solid var(--loss); border-radius: 12px;
  background: #fbeceb; color: var(--loss); font-size: 36px; font-weight: 700; font-stretch: 88%; white-space: nowrap; }
#unidades .chip .h { width: 28px; height: 28px; }

/* donde Parla está mejor */
#espera .eti-area { color: var(--gain); }
#espera .pareja .p.parla .q, #espera .pareja .p.parla .v { color: var(--gain); }
#espera .pareja .p.parla .bar { background: var(--gain); }

/* cien casas */
.cien { display: grid; grid-template-columns: repeat(10, 1fr); gap: 9px; width: 420px; }
.cien i { display: block; aspect-ratio: 1; border-radius: 50%; background: var(--pista); }
#estacion .col { position: absolute; top: 560px; width: 440px; }
#estacion .col .q { font-size: 38px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
#estacion .col .v { font-size: 220px; line-height: .9; margin: 10px 0 30px; }
#estacion .col.parla .q, #estacion .col.parla .v { color: var(--ref); }

/* el abono */
#atocha .abono { position: absolute; left: 80px; top: 1330px; width: 920px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; border-top: 2px solid var(--line); padding-top: 26px; }
#atocha .abono .eti { grid-column: 1 / -1; color: var(--ink-3); margin-bottom: 14px; }
#atocha .abono .q { font-size: 32px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
#atocha .abono .v { font-size: 110px; line-height: 1; font-variant-numeric: tabular-nums; }
#atocha .abono .z { font-size: 28px; font-weight: 500; color: var(--ink-3); }
#atocha .abono .parla .q, #atocha .abono .parla .v { color: var(--ref); }

/* series del dinero, como en la web */
.serie { position: absolute; left: 80px; top: 560px; width: 920px; }
.serie .f { padding: 14px 0 16px; border-top: 2px solid var(--line); }
.serie .f:last-child { border-bottom: 2px solid var(--line); }
.serie .f .cab { display: flex; justify-content: space-between; align-items: baseline; }
.serie .f .nom { font-size: 38px; font-weight: 500; color: var(--ink-3); }
.serie .f .val { font-size: 84px; font-weight: 800; font-stretch: 70%; font-variant-numeric: tabular-nums; line-height: 1; }
.serie .f .pista { height: 28px; border-radius: 14px; background: var(--pista); overflow: hidden; margin-top: 10px; }
.serie .f .pista i { display: block; height: 100%; border-radius: 14px; background: var(--gris-barra); transform-origin: left; }
.serie .f.aqui .nom { color: var(--ink); font-weight: 800; }
.serie .f.aqui .pista i { background: #555; }
.serie .f.ref .nom, .serie .f.ref .val { color: var(--ref); font-weight: 800; }
.serie .f.ref .pista i { background: var(--ref); }
.golpe-e { position: absolute; left: 80px; top: 1290px; width: 920px; font-size: 54px; font-weight: 800; font-stretch: 84%; letter-spacing: -.01em; line-height: 1.1; }
.golpe-e .cifra { color: var(--loss); font-size: 104px; font-stretch: 62%; text-transform: uppercase; letter-spacing: -.01em; line-height: .95; display: block; margin: 6px 0; }

/* las diez */
#diez .lista { position: absolute; left: 80px; top: 470px; width: 920px; }
#diez .f { display: grid; grid-template-columns: 300px 1fr 96px; align-items: center; column-gap: 20px; padding: 10px 0; border-top: 2px solid var(--line); }
#diez .f .nom { font-size: 36px; font-weight: 700; font-stretch: 86%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#diez .f .bar { height: 40px; background: var(--loss); transform-origin: left; }
#diez .f .v { text-align: right; font-size: 66px; font-weight: 800; font-stretch: 66%; color: var(--loss); line-height: 1; font-variant-numeric: tabular-nums; }
#diez .f.esta .nom { color: var(--ref); font-weight: 800; }
#diez .f .mas { display: block; height: 10px; background: var(--gain); margin-top: 6px; transform-origin: left; }
#diez .pie { position: absolute; left: 80px; top: 1440px; width: 920px; font-size: 36px; font-weight: 500; line-height: 1.3; color: var(--ink-2); }
#diez .pie b { color: var(--gain); }

/* golpe y cierre */
#golpe .g { position: absolute; left: 80px; top: 520px; width: 920px; }
#golpe .a { font-size: 60px; font-weight: 600; font-stretch: 88%; color: var(--ink-2); }
#golpe .b { font-size: 250px; color: var(--loss); margin: 20px 0 30px; }
#golpe .c { font-size: 64px; font-weight: 800; font-stretch: 84%; letter-spacing: -.01em; line-height: 1.1; }
#golpe .c b { color: var(--loss); }
#cierre .marca { position: absolute; left: 80px; top: 400px; width: 420px; }
#cierre .t { position: absolute; left: 80px; top: 820px; }
#cierre .t .x1 { font-size: 240px; }
#cierre .t .x2 { font-size: 240px; color: var(--loss); }
#cierre .url { position: absolute; left: 80px; top: 1280px; font-size: 50px; font-weight: 800; font-stretch: 80%; letter-spacing: -.01em; }
#cierre .elige { position: absolute; left: 80px; top: 1360px; font-size: 44px; font-weight: 600; font-stretch: 90%; color: var(--ref); }
</style>
</head>

const ballena = (cls = '') => `<svg class="ballena ${cls}" viewBox="31 55 384 256"><path class="sombra" d="${BALLENA[0]}"/><path class="luz" d="${BALLENA[1]}"/></svg>`;

const escena = (id, html, extra = '') => {

const base = (el) => +el.closest('[data-from]').dataset.from;
const FX = $$('[data-fx]').map((el) => ({ el, b: base(el) }));
const COUNTS = $$('[data-count]').map((el) => ({ el, b: base(el) }));
const SCENES = $$('.scene');
const CAPS = CAPITULOS.map(([id, n, t]) => [S[id], n, t]);
/* cortinillas rojas: centradas en el cambio de capítulo, con el capítulo que empieza */
const W = (t, rot) => [t - 0.45, t + 0.45, rot];
const WIPES = [[3.55, 4.45, '01 · La cuenta'], ...CAPITULOS.slice(1).map(([id, n, t]) => W(S[id], n ? n + ' · ' + t : ''))];
const PUSH = 0.45;

function aplicar(el, t) {
  const a = +el.dataset.a, d = +el.dataset.d, fx = el.dataset.fx;
  let p;
  switch (fx) {
    case 'up': p = prog(t, a, d, E.expo); el.style.transform = `translateY(${(1 - p) * 135}%)`; break;
    case 'fade': p = prog(t, a, d); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 18}px)`; break;
    case 'left': p = prog(t, a, d, E.expo); el.style.opacity = cl(p * 1.6); el.style.transform = `translateX(${(1 - p) * -90}px)`; break;
    case 'grow': p = prog(t, a, d, E.expo); el.style.transform = `scaleX(${p})`; break;
    case 'pop': p = cl((t - a) / d); el.style.opacity = cl(p * 3); el.style.transform = `scale(${0.6 + 0.4 * E.back(p)})`; el.style.transformOrigin = 'left center'; break;
    case 'slam': p = cl((t - a) / d); el.style.opacity = cl(p * 4); el.style.transform = `scale(${1 + 0.5 * (1 - E.out(p))})`; break;
  }
}

function mostrar(el, t) {
  const a = +el.dataset.from, b = +el.dataset.to;
  const ent = el.dataset.enter === 'push' ? PUSH : 0;
  const on = t >= a - ent && t < b;
  el.style.display = on ? 'block' : 'none';
  if (!on) return;
  let x = 0;
  if (ent && t < a) x = (1 - E.inOut(cl((t - (a - ent)) / ent))) * 1080;
  if (el.dataset.exit === 'left' && t > b - PUSH) x = -E.inOut(cl((t - (b - PUSH)) / PUSH)) * 1080;
  el.style.transform = x ? `translateX(${x}px)` : '';
}

/* una unidad que aparece */
function aparece(u, t, a, dur = 0.3) {
  const p = cl((t - a) / dur);
  u.style.opacity = cl(p * 3);
  u.style.transform = `scale(${Math.max(0, 0.4 + 0.6 * E.back(p))})`;
}

function render(t) {
  SCENES.forEach((s) => mostrar(s, t));
  FX.forEach(({ el, b }) => aplicar(el, t - b));
  COUNTS.forEach(({ el, b }) => {
    const v = +el.dataset.count, dec = +(el.dataset.dec || 0);
    let x = v * prog(t - b, +el.dataset.a, +el.dataset.d, E.out);
    if (dec === 0) x = Math.round(x);
    el.textContent = fmt(x, dec);
  });

  /* portada: quieta (es la miniatura) y, al final, un empujón hacia el número */
  const z = prog(t, 2.6, 1.0, E.in);
  const b1 = $('#portada .bloque'); b1.style.transformOrigin = '200px 1250px'; b1.style.transform = z ? `scale(${1 + z * 0.25})` : '';

  /* bibliotecas: las de la otra y, cuando la voz llega a Parla, las suyas y sus huecos */
  const TC = S.cuenta;
  $$('#tira-otra > *').forEach((u, i) => aparece(u, t, TC + 1.2 + i * 0.12));
  $$('#tira-parla > *').forEach((u, i) => aparece(u, t, TC + 5.2 + i * (i < B.parla ? 0.12 : 0.35)));

  /* el total: lo que hay de golpe y los huecos uno a uno, con el contador al paso */
  const T0 = S.total + 1.0, PASO = 0.11;
  let hechos = 0;
  $$('#rej > *').forEach((u, i) => {
    if (i < F.tiene) { aparece(u, t, S.total + 0.3 + i * 0.008, 0.25); return; }
    const k = i - F.tiene, a = T0 + k * PASO;
    if (t >= a) hechos = k + 1;
    aparece(u, t, a, 0.2);
  });
  $('#n-total').textContent = hechos;
  const g = cl((t - (T0 + F.total * PASO)) / 0.4);
  $('#total .n').style.transform = g > 0 && g < 1 ? `scale(${1 + 0.06 * Math.sin(g * Math.PI)})` : '';

  /* cien casas: se llenan las que tienen estación */
  $$('.cien').forEach((c) => {
    const n = +c.dataset.casas, a = S.estacion + +c.dataset.a;
    const llenas = Math.round(n * prog(t, a, 1.0, E.out));
    Array.from(c.children).forEach((p, i) => { p.style.background = i < llenas ? c.dataset.color : ''; });
  });

  /* cortinillas */
  const wipe = $('#wipe');
  const w = WIPES.find(([a, b]) => t >= a && t < b);
  if (w) {
    const [a, b, rot] = w, m = (a + b) / 2;
    wipe.style.display = 'block';
    wipe.style.clipPath = t < m ? `inset(${(1 - E.inOut(cl((t - a) / (m - a)))) * 100}% 0 0 0)` : `inset(0 0 ${E.inOut(cl((t - m) / (b - m))) * 100}% 0)`;
    wipe.firstElementChild.style.transform = `translateY(${(1 - prog(t, a + .05, .4, E.expo)) * 60}px)`;
    const r = $('#wipe-rot'); r.textContent = rot; r.style.opacity = prog(t, a + .2, .2);
  } else wipe.style.display = 'none';

  /* marca, capítulo y barra de avance */
  const conMarca = t >= S.cuenta && t < S.cierre;
  $('#bug').style.opacity = conMarca ? 1 : 0;
  const cap = CAPS.filter((c) => t >= c[0]).pop(), capEl = $('#cap');
  if (cap && cap[1]) {
    $('#cap-n').textContent = cap[1]; $('#cap-t').textContent = cap[2];
    const p = prog(t, cap[0] + 0.3, 0.4, E.expo);
    capEl.style.opacity = p; capEl.style.transform = `translateY(${(1 - p) * 30}px)`;
  } else capEl.style.opacity = 0;
  $('#barra').style.transform = `scaleX(${t / DUR})`;
  $('#barra').style.opacity = t >= S.cuenta ? 1 : 0;
}

window.render = render; window.DUR = DUR;
document.title = 'Parla y ' + O + ' · ' + num(DUR, 1) + ' s';
document.fonts.ready.then(() => { window.listo = true; render(+location.hash.slice(1) || 0); });
</script>
